# Alembic configuration.
#
# The connection is NOT configured here. `sqlalchemy.url` is deliberately left empty: migrations
# run under the privileged connection (DATABASE_URL_PRIVILEGED), which env.py reads from the
# environment through weathra.config, so a privileged credential never sits in a checked-in file.

[alembic]
script_location = weathra/db/migrations
prepend_sys_path = .
path_separator = os
sqlalchemy.url =

[post_write_hooks]
hooks = ruff_format
ruff_format.type = exec
ruff_format.executable = ruff
ruff_format.options = format REVISION_SCRIPT_FILENAME

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
