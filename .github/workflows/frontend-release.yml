name: frontend-release

# Weathra — the frontend production release pipeline. Task 23.5.
#
# Design decision 19: "on merge to the default branch ... deploy the frontend to Vercel". This is
# that half. `release.yml` is the backend's, and the two are deliberately separate workflows rather
# than jobs in one:
#
#   - `release.yml` is path-filtered to `weathra/backend/**` and `render.yaml`, so a frontend-only
#     change would never trigger it. Adding a Vercel job there would mean frontend changes never
#     deployed, or widening that filter until every frontend commit re-ran a migration and a
#     container release it had no reason to touch.
#   - The frontend has no ordering constraint to honour. The backend's four jobs exist because
#     migrations must land before the new release serves traffic; nothing here depends on the
#     database at all. Borrowing that chain would imply a coupling that does not exist.
#
# This workflow reads repository secrets, so it is not ordinary CI. It is classified as a release
# pipeline in `backend/tests/test_release_workflow.py`, which also asserts what it may not hold: no
# database connection of either kind, no service-role key, no Render credential, and no Alembic
# command. Its blast radius is one Vercel project.

on:
  push:
    branches: [main]
    paths:
      - "weathra/frontend/**"
      - ".github/workflows/frontend-release.yml"
  workflow_dispatch:

concurrency:
  # Matching `release.yml`: queue rather than cancel. A Vercel deployment is atomic, so a cancelled
  # one cannot leave a half-served frontend — but two racing deployments can still finish out of
  # order, promoting the older commit to production.
  group: frontend-release-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: build and deploy to Vercel
    runs-on: ubuntu-latest

    env:
      # Deliberately *not* named VERCEL_ORG_ID and VERCEL_PROJECT_ID, and that is the whole point
      # of this mapping. The repository secrets keep those names; only what the CLI process sees
      # is renamed.
      #
      # The CLI auto-detects that pair (`getPlatformEnv("ORG_ID")` / `("PROJECT_ID")`) and, when it
      # finds both, takes its implicit env-link path: it appends `?teamId=` to the project lookup
      # and issues an unscoped team lookup alongside it. Vercel's own documentation says a
      # team-scoped token needs neither — "Vercel infers the team and project from the token's
      # scope, so you can omit those parameters"; full-account tokens are the ones that still need
      # `?teamId=`. Our token is scoped to the `weathra` team, and that path is what it is refused
      # on, reported as the misleading "Could not retrieve Project Settings. To link your Project,
      # remove the `.vercel` directory and deploy again" (vercel/vercel#10874 — a permission 403
      # dressed up as a stale link; there is no `.vercel` directory on a fresh runner).
      #
      # Under neutral names the CLI cannot find them, so it resolves the project from `--project`
      # and takes the team from the project's own `accountId`. Neither request carries `teamId`,
      # and neither needs the user-level `/v2/user` lookup that a team-scoped token is blocked from
      # — which is also why there is no `--scope` here: `--scope` resolves the team *through* the
      # user identity, so it fails before it ever reaches the project.
      WEATHRA_VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      WEATHRA_VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      # Read from the environment rather than passed as `--token` on each command. A token on a
      # command line is visible in the runner's process list and survives in any shell trace; the
      # CLI reads this variable on its own, so no step names the credential at all.
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: weathra/frontend/package-lock.json

      # Pinned, like every other tool in this repository: a CLI that silently changed its build
      # output would change what production serves without a commit saying so.
      - name: Install the Vercel CLI
        run: npm install --global vercel@59.11.7

      # Run from the repository root, not from `weathra/frontend`. The Vercel project's Root
      # Directory is `weathra/frontend`, and that setting is resolved relative to wherever the CLI
      # considers the project to start. Running from the repository root is what makes the two
      # agree; running from inside the frontend would look for `weathra/frontend/weathra/frontend`.
      #
      # `vercel pull` brings down the project's environment variables for the Production
      # environment, which is where the three NEXT_PUBLIC_ values live. They are set per
      # environment in the Vercel project rather than here, so a preview and production can point
      # at different backends without a commit — which is what task 23.5 asks for. It also means
      # this file names no configuration value at all.
      #
      # `--project` names the existing project by id, which is the whole of the linking mechanism
      # here — see the `env:` block for why nothing else may be. It also changes what happens when
      # the project cannot be resolved: `--yes` alone permits the CLI to read an unresolved project
      # as licence to *create* one, named after the directory it ran in, and to deploy that instead
      # of the real one. `--project` sets `failIfNotFound`, so the same situation exits non-zero.
      # It is what keeps this workflow incapable of quietly standing up a second Vercel project
      # alongside the real one; `test_the_frontend_release_cannot_create_a_vercel_project` holds it.
      #
      # The value reads from the job environment, so no step names a secret in a command line.
      - name: Pull the production environment
        run: |
          set -euo pipefail
          vercel pull --yes --environment=production \
            --project "$WEATHRA_VERCEL_PROJECT_ID"

      # The org id is not used to *find* anything — that is what broke, and what the `env:` block
      # explains. It is used to check the answer. `vercel pull` writes the link it resolved to
      # `.vercel/project.json`, so comparing that file's `orgId` against the team we expect proves
      # the project the CLI found is the one the Weathra team owns, without sending the CLI back
      # down the lookup path a team-scoped token is refused on.
      #
      # This is strictly stronger than passing the id in: an identifier handed to a lookup is an
      # assumption, whereas this is the resolved answer being held to it. It runs before the build
      # so a mismatch costs nothing and promotes nothing. Neither value is printed — a mismatch
      # says that it happened, not what the two ids were.
      - name: Verify the pulled project belongs to the Weathra team
        run: |
          set -euo pipefail
          resolved="$(jq -r '.orgId' .vercel/project.json)"
          if [ "$resolved" != "$WEATHRA_VERCEL_ORG_ID" ]; then
            echo "the pulled project does not belong to the expected team; refusing to build" >&2
            exit 1
          fi
          echo "the pulled project belongs to the expected team"

      # Next.js inlines NEXT_PUBLIC_ values at build time, so the build has to happen after the
      # pull and with those values in scope. Building here rather than on Vercel means the bundle
      # that gets promoted is the one this commit produced.
      #
      # No `--project` here, deliberately: the pull wrote `.vercel/project.json` and
      # `.vercel/.env.production.local`, and the build's job is to consume exactly what the pull
      # resolved — and what the step above just held to the expected team. Naming the project
      # again would send the build back to the API to re-resolve it, which is a second chance for
      # the build to disagree with the thing that was pulled and verified.
      - name: Build
        run: vercel build --prod

      # Named for the same reason as the pull. The promotion is the step that would do the damage
      # if the link were ever wrong, so it resolves the project explicitly rather than inheriting
      # whatever the runner happens to have on disk.
      - name: Deploy
        id: deploy
        run: |
          set -euo pipefail
          url="$(vercel deploy --prebuilt --prod \
            --project "$WEATHRA_VERCEL_PROJECT_ID")"
          printf 'url=%s\n' "$url" >> "$GITHUB_OUTPUT"

      # The deployment answering for itself, in the same way the backend release ends by asking the
      # deployed service whether it is ready. `/sign-in` is public and server-rendered, so a 200
      # here means Next.js started and rendered on Vercel — not merely that an upload succeeded.
      - name: Verify the deployment serves
        run: |
          set -euo pipefail
          url="${{ steps.deploy.outputs.url }}"
          for attempt in 1 2 3 4 5 6; do
            status="$(curl -sS -o /dev/null -w '%{http_code}' --max-time 20 "$url/sign-in" || echo 000)"
            if [ "$status" = "200" ]; then
              echo "the deployment serves /sign-in"
              exit 0
            fi
            echo "attempt $attempt: /sign-in answered $status; retrying"
            sleep 10
          done
          echo "the deployment never served /sign-in" >&2
          exit 1
