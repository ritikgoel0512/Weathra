name: frontend-release

# Weathra — the frontend production release pipeline. Task 23.5.
#
# Design decision 19: "on merge to the default branch ... deploy the frontend to Vercel". This is
# that half. `release.yml` is the backend's, and the two are deliberately separate workflows rather
# than jobs in one:
#
#   - `release.yml` is path-filtered to `weathra/backend/**` and `render.yaml`, so a frontend-only
#     change would never trigger it. Adding a Vercel job there would mean frontend changes never
#     deployed, or widening that filter until every frontend commit re-ran a migration and a
#     container release it had no reason to touch.
#   - The frontend has no ordering constraint to honour. The backend's four jobs exist because
#     migrations must land before the new release serves traffic; nothing here depends on the
#     database at all. Borrowing that chain would imply a coupling that does not exist.
#
# This workflow reads repository secrets, so it is not ordinary CI. It is classified as a release
# pipeline in `backend/tests/test_release_workflow.py`, which also asserts what it may not hold: no
# database connection of either kind, no service-role key, no Render credential, and no Alembic
# command. Its blast radius is one Vercel project.

on:
  push:
    branches: [main]
    paths:
      - "weathra/frontend/**"
      - ".github/workflows/frontend-release.yml"
      - ".github/scripts/vercel_release_env.py"
      - ".github/scripts/vercel_release_alias.py"
  workflow_dispatch:

concurrency:
  # Matching `release.yml`: queue rather than cancel. A Vercel deployment is atomic, so a cancelled
  # one cannot leave a half-served frontend — but two racing deployments can still finish out of
  # order, promoting the older commit to production.
  group: frontend-release-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: build and deploy to Vercel
    runs-on: ubuntu-latest

    env:
      # Deliberately *not* named VERCEL_ORG_ID and VERCEL_PROJECT_ID. Under those names the CLI
      # auto-detects the pair and resolves the project through the API on every command; under
      # neutral names the `.vercel/project.json` written below stays the authority, and
      # `vercel build` and `vercel deploy --prebuilt` resolve the project from disk without a
      # single lookup. Fewer requests is not the point — the point is that the file the ownership
      # check vouched for is the file the build and the promotion use.
      #
      # There is also no `--scope` anywhere here. The CLI resolves `--scope` through the user
      # identity: `getUser` runs first, and a team-scoped token is refused on the user endpoint, so
      # `--scope` fails with "User not found. (404)" before reaching the project at all.
      WEATHRA_VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      WEATHRA_VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      # Read from the environment rather than passed as `--token` on each command. A token on a
      # command line is visible in the runner's process list and survives in any shell trace; both
      # the CLI and the script below read this variable on their own, so no step names the
      # credential at all.
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: weathra/frontend/package-lock.json

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      # Pinned, like every other tool in this repository: a CLI that silently changed its build
      # output would change what production serves without a commit saying so.
      - name: Install the Vercel CLI
        run: npm install --global vercel@59.11.7

      # This replaces `vercel pull`, which cannot work under this pipeline's credential.
      #
      # Reading CLI 59.11.7: once `getLinkedProject` holds a link it calls `getOrgById` —
      # `GET /v2/teams/<team_id>` — unconditionally, and a token scoped to a team rather than to
      # the whole account is refused there with 403 `team_unauthorized`. The CLI reports that as
      # "Could not retrieve Project Settings. To link your Project, remove the `.vercel` directory
      # and deploy again", which is a message about a directory a fresh runner does not have, on a
      # request that had nothing to do with the project. `vercel deploy` survives the refusal
      # because it alone passes `allowOwnerLookupFallback`; `pull` passes neither that nor
      # `skipRemoteLookup` and then reads `org.id`, so for `pull` it is fatal. No flag changes
      # that, which is why three runs spent on flags all failed at the same step.
      #
      # So the two files `vercel pull` would have written are written from the project-scoped REST
      # API the token *can* reach — `/v9/projects/<id>` and `/v9/projects/<id>/env?decrypt=true` —
      # in the formats the CLI reads back: `.vercel/project.json` exactly as
      # `writeProjectSettings` writes it, and `.vercel/.env.production.local` exactly as
      # `vercel env pull` serialises it. The script fails closed on every partial answer; see its
      # docstring. Both files are runner state and `.gitignore` keeps them out of the tree.
      #
      # Run from the repository root, like the two CLI commands below. The Vercel project's Root
      # Directory is `weathra/frontend`, and `vercel build` reads that setting *out of the file
      # written here* to find the application; the CLI resolves `.vercel/` and `.vercel/output`
      # against the directory it was invoked from, so all three steps agree only if all three run
      # from the root.
      - name: Resolve the project and its production environment
        run: |
          set -euo pipefail
          python3 .github/scripts/vercel_release_env.py \
            --project-id "$WEATHRA_VERCEL_PROJECT_ID" \
            --expect-org-id "$WEATHRA_VERCEL_ORG_ID" \
            --directory .

      # The ownership assertion, restated against the artifact the build actually consumes.
      #
      # The real check happens in the script, against the `accountId` the project API returned —
      # the resolved answer to "who owns this project", not the assumption we started from. That
      # is also the value it writes into `.vercel/project.json`, which is what keeps this step from
      # being a restatement of its own input: it holds the file `vercel build` and
      # `vercel deploy --prebuilt` will resolve the project from to the team we expect, after the
      # file exists and before anything is built.
      #
      # Neither value is printed — a mismatch says that it happened, not what the two ids were.
      - name: Verify the project the build will use belongs to the Weathra team
        run: |
          set -euo pipefail
          resolved="$(jq -r '.orgId' .vercel/project.json)"
          if [ "$resolved" != "$WEATHRA_VERCEL_ORG_ID" ]; then
            echo "the resolved project does not belong to the expected team; refusing to build" >&2
            exit 1
          fi
          echo "the project the build will use belongs to the expected team"

      # Next.js inlines NEXT_PUBLIC_ values at build time, so the build has to happen after the
      # environment is written and with those values in scope. Building here rather than on Vercel
      # means the bundle that gets promoted is the one this commit produced.
      #
      # No `--project` here, deliberately: the step above wrote `.vercel/project.json` and
      # `.vercel/.env.production.local`, and the build's job is to consume exactly what was
      # resolved — and what the check above just held to the expected team. Naming the project
      # again would send the build to the API to re-resolve it, which is a second chance for the
      # build to disagree with the thing that was verified.
      - name: Build
        run: vercel build --prod

      # `--project` is named here and nowhere else. The promotion is the step that would do the
      # damage if the link were ever wrong, so it resolves the project explicitly rather than
      # inheriting whatever the runner happens to have on disk — and because the id matches the
      # local link, the CLI takes its local path and promotes without a lookup.
      #
      # It is also what keeps this workflow incapable of standing up a *second* Vercel project:
      # `--project` sets the CLI's `failIfNotFound`, so an unresolvable project exits non-zero,
      # where `--yes` alone would let the CLI read one as licence to create a project named after
      # the directory it ran in and promote that instead.
      # `test_the_frontend_release_cannot_create_a_vercel_project` holds it.
      - name: Deploy
        id: deploy
        run: |
          set -euo pipefail
          url="$(vercel deploy --prebuilt --prod \
            --project "$WEATHRA_VERCEL_PROJECT_ID")"
          printf 'url=%s\n' "$url" >> "$GITHUB_OUTPUT"

      # The URL `vercel deploy` prints is the deployment's own, and production is not served on it.
      # Vercel's Standard Deployment Protection answers every generated deployment URL with a 302 to
      # `vercel.com/sso-api`, so verifying that URL could never see a 200 — and, worse, could not
      # distinguish a healthy deployment from one returning 500 on every route, which is exactly
      # what it failed to notice once already.
      #
      # So the public production domain is read from the deployment itself — the `alias` field, the
      # same one the CLI prints as `▲ Aliased`. Resolved rather than written down here: a hard-coded
      # hostname stays green while pointing at whatever was promoted last, possibly from another
      # commit, and would outlive a domain change in silence. The script refuses to print a
      # hostname until the deployment it was given is this project's, targets production, is READY
      # and has its aliases assigned — so what is verified below cannot be a different deployment
      # answering for this one.
      - name: Resolve the public production domain
        id: alias
        run: |
          set -euo pipefail
          host="$(python3 .github/scripts/vercel_release_alias.py \
            --project-id "$WEATHRA_VERCEL_PROJECT_ID" \
            --deployment-url "${{ steps.deploy.outputs.url }}")"
          printf 'host=%s\n' "$host" >> "$GITHUB_OUTPUT"

      # The deployment answering for itself, in the same way the backend release ends by asking the
      # deployed service whether it is ready. `/sign-in` is public and server-rendered, so a 200
      # here means Next.js started and rendered on Vercel — not merely that an upload succeeded.
      #
      # A 302 to `vercel.com/sso-api` is called out rather than retried: it means the domain being
      # verified is behind Deployment Protection, which no amount of waiting fixes and which would
      # otherwise read as "the app is slow to start".
      - name: Verify the production domain serves
        run: |
          set -euo pipefail
          url="https://${{ steps.alias.outputs.host }}"
          for attempt in 1 2 3 4 5 6; do
            status="$(curl -sS -o /dev/null -w '%{http_code}' --max-time 20 "$url/sign-in" || echo 000)"
            if [ "$status" = "200" ]; then
              echo "production serves /sign-in"
              exit 0
            fi
            if [ "$status" = "302" ]; then
              location="$(curl -sS -o /dev/null -w '%{redirect_url}' --max-time 20 "$url/sign-in" || echo)"
              case "$location" in
                *vercel.com/sso-api*)
                  echo "production is behind Vercel Deployment Protection, so it is not publicly reachable" >&2
                  exit 1
                  ;;
              esac
            fi
            echo "attempt $attempt: /sign-in answered $status; retrying"
            sleep 10
          done
          echo "production never served /sign-in" >&2
          exit 1
