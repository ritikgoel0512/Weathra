[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "weathra"
version = "0.1.0"
description = "Weathra backend — agentic weather intelligence, forecast analysis, and analytics"
license = "MIT"
requires-python = ">=3.12,<3.13"

dependencies = [
    # HTTP surface
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "httpx>=0.27",
    "sse-starlette>=2.1",
    # Models and configuration
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    # Orchestration
    "langgraph>=0.2.50",
    "langgraph-checkpoint-postgres>=2.0.2",
    "psycopg[binary,pool]>=3.2",
    # Tool boundary
    "mcp>=1.1",
    # Persistence
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "pgvector>=0.3.6",
    # Knowledge
    "fastembed>=0.4",
    # Analytics
    "numpy>=2.1",
    # Token validation against Supabase's published signing keys
    "pyjwt[crypto]>=2.10",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "respx>=0.21",
    "ruff>=0.8",
    "mypy>=1.13",
    "types-python-dateutil>=2.9",
    "pyyaml>=6.0",
    "types-PyYAML>=6.0",
]

[project.scripts]
weathra-evaluate = "weathra.evaluation.runner:main"
weathra-ingest-corpus = "weathra.rag.ingest:main"
weathra-retention = "weathra.memory.retention:main"

[tool.setuptools.packages.find]
include = ["weathra*"]

[tool.setuptools.package-data]
weathra = [
    "rag/corpus/*.md",
    "evaluation/dataset/*.json",
    "evaluation/fixtures/*.json",
    "db/migrations/**/*",
]

# ---------------------------------------------------------------- ruff

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["."]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "N",    # pep8-naming
    "UP",   # pyupgrade
    "B",    # bugbear
    "C4",   # comprehensions
    "SIM",  # simplify
    "RUF",  # ruff-specific
    "ASYNC",
]
ignore = [
    "B008",   # FastAPI's Depends() in defaults is the documented idiom
    "RUF012", # ClassVar annotations are noise on pydantic model config dicts
    "N818",   # design.md decision 16 names the error classes (ValidationFailed, ProviderTimeout,
              # LocationNotFound, ...). The spec's names win over the -Error suffix convention.
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["weathra"]

[tool.ruff.format]
quote-style = "double"

# ---------------------------------------------------------------- mypy

[tool.mypy]
python_version = "3.12"
packages = ["weathra", "tests"]
strict = false
warn_redundant_casts = true
warn_unused_ignores = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_return_any = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_defs = false

[[tool.mypy.overrides]]
module = [
    "fastembed.*",
    "pgvector.*",
    "langgraph.*",
    "langgraph_checkpoint_postgres.*",
    "mcp.*",
    "respx.*",
]
ignore_missing_imports = true

# ---------------------------------------------------------------- pytest

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
# `live` needs real upstream services; `db` needs a real Postgres. Neither runs by default.
addopts = "-m 'not live and not db' --strict-markers --strict-config -q"
markers = [
    "live: exercises a real external service (Open-Meteo, OpenRouter, Supabase). Deselected by default.",
    "db: requires a live PostgreSQL with pgvector. Deselected by default.",
]
filterwarnings = ["error::DeprecationWarning:weathra.*"]
